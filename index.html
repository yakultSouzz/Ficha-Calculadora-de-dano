<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8dcb8">
<title>Ficha — Kaelen</title>
<link rel="stylesheet" href="/src/style.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div class="app" id="app"></div>

<button class="history-fab" id="historyFab" onclick="openHistoryModal()" aria-label="Histórico">
  📜<span class="fab-badge" id="fabBadge" style="display:none">0</span>
</button>

<div class="numpad-overlay" id="numpadOverlay" onclick="if(event.target===this)closeNumpad()">
  <div class="numpad" id="numpadEl">
    <div class="numpad-header">
      <div class="numpad-title-wrap">
        <span class="numpad-label" id="numpadLabel">Rolagem</span>
        <span class="np-die" id="numpadDie">d20</span>
      </div>
      <button class="numpad-close" onclick="closeNumpad()">×</button>
    </div>
    <div class="numpad-display">
      <span class="numpad-value" id="numpadValue">0</span>
      <span class="numpad-eq" id="numpadEq">=</span>
      <span class="numpad-total" id="numpadTotal">—</span>
    </div>
    <div class="numpad-hint">
      <span id="numpadBonus">bônus +0</span>
      <span class="hint-sep" id="numpadHintSep">•</span>
      <span id="numpadRange">1–20</span>
    </div>
    <div class="numpad-roll-modes" id="numpadRollModes" style="display:none">
      <button class="numpad-mode-btn active" onclick="setRollMode('normal')">Normal</button>
      <button class="numpad-mode-btn" onclick="setRollMode('adv')">Vantagem</button>
      <button class="numpad-mode-btn" onclick="setRollMode('dis')">Desvantagem</button>
    </div>
    <div class="numpad-chips" id="numpadChips"></div>
    <div class="numpad-digits">
      <button class="np-btn" onclick="npDigit('1')">1</button>
      <button class="np-btn" onclick="npDigit('2')">2</button>
      <button class="np-btn" onclick="npDigit('3')">3</button>
      <button class="np-btn" onclick="npDigit('4')">4</button>
      <button class="np-btn" onclick="npDigit('5')">5</button>
      <button class="np-btn" onclick="npDigit('6')">6</button>
      <button class="np-btn" onclick="npDigit('7')">7</button>
      <button class="np-btn" onclick="npDigit('8')">8</button>
      <button class="np-btn" onclick="npDigit('9')">9</button>
      <button class="np-btn np-del" onclick="npDel()">⌫</button>
      <button class="np-btn" onclick="npDigit('0')">0</button>
      <button class="np-btn np-ok" id="npOkBtn" onclick="npConfirm()">✓</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Editar</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveModal()">Salvar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>

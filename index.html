<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8dcb8">
<title>Ficha — Kael</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --paper:#faf6e9;--paper-2:#f4ecd4;--paper-3:#ede2c0;
  --bg-1:#f2e9cc;--bg-2:#e8dcb8;
  --ink:#2d2418;--ink-soft:#6d5d4a;--ink-dim:#948671;
  --red:#6b1f11;--red-deep:#4a1508;--red-light:#8f2a1a;
  --red-wash:rgba(107,31,17,0.06);--red-wash-2:rgba(107,31,17,0.12);
  --gold:#a67c00;--gold-light:#c9a227;--green:#4a6b3a;
  --moon:#5b4a9c;--moon-wash:rgba(91,74,156,0.08);
  --border:rgba(107,31,17,0.2);--border-soft:rgba(107,31,17,0.08);
  --border-mid:rgba(107,31,17,0.35);
  --shadow-sm:0 1px 2px rgba(107,31,17,0.06);
  --shadow:0 2px 8px rgba(107,31,17,0.08),0 1px 2px rgba(107,31,17,0.04);
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --mode-accent:#6b1f11;--mode-wash:rgba(107,31,17,0.04);
}
html,body{background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed;color:var(--ink);min-height:100vh;
  padding:12px 12px 48px;font-family:var(--sans);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 20% 30%,var(--mode-wash) 0%,transparent 45%),
    radial-gradient(circle at 80% 70%,var(--mode-wash) 0%,transparent 45%);}
.app{max-width:680px;margin:0 auto;position:relative;z-index:1;}

.history-fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,20px));right:20px;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--red-light),var(--red));
  border:2px solid var(--gold-light);color:var(--paper);font-size:22px;
  cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(107,31,17,0.5),0 2px 6px rgba(0,0,0,0.2);
  transition:transform .15s;}
.history-fab:active{transform:scale(.92);}
.history-fab .fab-badge{position:absolute;top:-4px;right:-4px;
  min-width:22px;height:22px;background:var(--gold-light);color:var(--red-deep);
  border-radius:11px;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  border:2px solid var(--paper);font-family:var(--sans);
  box-shadow:0 1px 4px rgba(0,0,0,0.2);}

.hist-tabs{display:flex;gap:0;margin-bottom:12px;
  border-bottom:2px solid var(--red);padding:0 2px;}
.hist-tab{flex:1;padding:10px 6px;background:transparent;border:none;
  border-bottom:3px solid transparent;margin-bottom:-2px;
  color:var(--ink-soft);font-family:var(--serif);
  font-size:12px;font-weight:700;font-variant:small-caps;
  letter-spacing:1px;cursor:pointer;transition:all .2s;}
.hist-tab.active{color:var(--red);border-bottom-color:var(--red);
  background:rgba(107,31,17,0.04);}
.hist-panel{display:none;}
.hist-panel.active{display:block;}
.hist-entry{background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border:1px solid var(--border-soft);border-left:3px solid var(--border-mid);
  border-radius:6px;padding:8px 11px;margin-bottom:5px;}
.hist-entry.crit{border-left-color:var(--gold-light);
  background:linear-gradient(180deg,rgba(201,162,39,0.06),rgba(201,162,39,0.02));}
.hist-entry-header{display:flex;justify-content:space-between;
  align-items:center;gap:8px;margin-bottom:3px;}
.hist-time{font-family:var(--sans);font-size:10px;font-weight:800;
  color:var(--ink-dim);letter-spacing:0.5px;font-variant-numeric:tabular-nums;}
.hist-label{font-family:var(--serif);font-size:12px;font-weight:700;
  color:var(--red);flex:1;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-entry.crit .hist-label{color:var(--gold);}
.hist-entry-body{font-family:var(--serif);font-size:12px;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.4;}
.hist-entry-body b{color:var(--red);font-size:14px;}
.hist-entry.crit .hist-entry-body b{color:var(--gold);}
.hist-empty{text-align:center;padding:30px 14px;color:var(--ink-dim);
  font-size:12px;font-style:italic;}

.calc-tap{margin-left:auto;flex-shrink:0;padding:3px 9px;min-width:38px;
  background:linear-gradient(180deg,#fff,var(--paper-2));
  border:1.5px solid var(--border);border-radius:7px;
  font-family:var(--serif);font-size:13px;font-weight:800;
  color:var(--ink-dim);cursor:pointer;text-align:center;
  transition:all .12s;font-variant-numeric:tabular-nums;
  -webkit-appearance:none;appearance:none;
  display:inline-flex;align-items:center;justify-content:center;
  gap:3px;line-height:1.1;}
.calc-tap:active{transform:scale(.92);}
.calc-tap.filled{background:linear-gradient(180deg,var(--red-light),var(--red));
  color:var(--paper);border-color:var(--red-deep);
  box-shadow:0 1px 4px rgba(107,31,17,0.3);}
.calc-tap.just-confirmed{animation:calcPop .4s cubic-bezier(.2,1.4,.5,1);}
@keyframes calcPop{0%{transform:scale(.7);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.calc-tap.crit{background:linear-gradient(180deg,#fbbf24,#eab308);
  color:#451a03;border-color:#b45309;box-shadow:0 1px 6px rgba(234,179,8,0.5);}
.calc-tap.fail{background:linear-gradient(180deg,#9ca3af,#6b7280);
  color:#fff;border-color:#4b5563;}
.calc-tap.invalid{background:linear-gradient(180deg,#fef2f2,#fee2e2);
  color:#b91c1c;border-color:#fca5a5;}
/* Critical damage tap */
.calc-tap.crit-tap{
  border-color:var(--gold-light);
  background:linear-gradient(180deg,#fef9e7,#fdf0c8);
  color:var(--gold);
}
.calc-tap.crit-tap:active{transform:scale(.92);}
.calc-tap.crit-tap.filled{
  background:linear-gradient(180deg,#fbbf24,#eab308);
  color:#451a03;border-color:#b45309;
  box-shadow:0 1px 6px rgba(234,179,8,0.5);
}
.calc-tap.crit-tap.invalid{
  background:linear-gradient(180deg,#fef2f2,#fee2e2);
  color:#b91c1c;border-color:#fca5a5;
}

/* Critical damage line */
.atk-line.crit-line{
  background:rgba(201,162,39,0.08);
  border-radius:5px;
  padding:4px 6px;
  margin-top:5px;
  border-left:2px solid var(--gold-light);
}
.atk-line.crit-line .ico{opacity:1;}
.atk-line.crit-line .lbl{color:var(--gold);font-weight:800;}
.atk-line.crit-line .val{color:var(--gold);}
.atk-line.crit-line .val .type{
  font-size:10px;color:var(--gold);opacity:0.75;font-weight:600;
}

.num-field{
  width:100%;min-height:38px;padding:9px 11px;background:#fff;
  border:1px solid var(--border);border-radius:7px;color:var(--ink);
  font-family:var(--serif);font-size:15px;font-weight:700;
  text-align:center;cursor:pointer;transition:all .12s;
  user-select:none;display:flex;align-items:center;justify-content:center;
  gap:5px;position:relative;font-variant-numeric:tabular-nums;}
.num-field:active{background:var(--red-wash);border-color:var(--red);transform:scale(.98);}
.num-field::after{content:'✎';font-size:10px;color:var(--ink-dim);
  opacity:0.5;margin-left:auto;position:absolute;right:8px;}
.num-field.just-confirmed{animation:calcPop .4s cubic-bezier(.2,1.4,.5,1);
  background:rgba(107,31,17,0.05);}
.class-item .num-field{width:60px;min-height:30px;padding:6px 8px;font-size:13px;}
.class-item .num-field::after{display:none;}

.numpad-overlay{position:fixed;inset:0;background:rgba(45,36,24,0.28);
  display:none;align-items:flex-end;justify-content:center;
  z-index:10001;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.numpad-overlay.show{display:flex;}
.numpad{background:var(--paper);width:100%;max-width:400px;
  border-radius:16px 16px 0 0;border-top:3px solid var(--red);
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 40px rgba(45,36,24,0.4);
  animation:slideUpNP .22s cubic-bezier(.2,.9,.3,1);
  transition:border-color .2s,box-shadow .2s;}
@keyframes slideUpNP{from{transform:translateY(100%);}to{transform:translateY(0);}}
/* Critical damage mode */
.numpad.crit-damage{
  border-top-color:var(--gold-light);
  box-shadow:0 -8px 40px rgba(201,162,39,0.35);
}
.numpad.crit-damage .numpad-label{color:var(--gold);}
.numpad.crit-damage .np-die{background:rgba(201,162,39,0.2);color:var(--gold);}
.numpad.crit-damage .numpad-total.filled{color:var(--gold);background:rgba(201,162,39,0.15);}
.numpad.crit-damage .numpad-total.crit{color:var(--gold);background:rgba(201,162,39,0.25);}
.numpad.crit-damage .np-chip.np-crit{
  background:linear-gradient(180deg,#fbbf24,#eab308);
  color:#451a03;border-color:#b45309;}
.numpad.crit-damage .np-btn.np-ok{
  background:linear-gradient(180deg,#fbbf24,#eab308);
  color:#451a03;border-color:#b45309;}
.numpad-header{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;padding:0 2px;gap:8px;}
.numpad-title-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.numpad-label{font-family:var(--serif);font-size:12px;font-weight:700;
  color:var(--red);letter-spacing:0.3px;
  flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.np-die{flex-shrink:0;background:var(--red-wash-2);color:var(--red);
  padding:2px 8px;border-radius:6px;font-weight:800;
  font-family:var(--serif);font-size:11px;letter-spacing:0.3px;white-space:nowrap;}
.numpad-close{background:none;border:none;color:var(--ink-soft);
  font-size:22px;width:26px;height:26px;cursor:pointer;
  border-radius:6px;line-height:1;flex-shrink:0;}
.numpad-close:active{background:var(--red-wash);}
.numpad-display{display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--paper-2);border:1px solid var(--border-soft);
  border-radius:8px;padding:6px 10px;margin-bottom:4px;min-height:44px;}
.numpad-value{font-family:var(--serif);font-size:24px;font-weight:800;
  color:var(--ink);min-width:36px;text-align:center;
  font-variant-numeric:tabular-nums;}
.numpad-eq{font-family:var(--serif);font-size:18px;color:var(--ink-dim);}
.numpad-total{font-family:var(--serif);font-size:24px;font-weight:800;
  color:var(--ink-dim);min-width:44px;text-align:center;
  padding:2px 8px;border-radius:6px;
  font-variant-numeric:tabular-nums;transition:all .15s;}
.numpad-total.filled{color:var(--red);background:var(--red-wash);}
.numpad-total.crit{color:var(--gold);background:rgba(201,162,39,0.18);}
.numpad-total.fail{color:#6b7280;background:rgba(107,114,128,0.1);}
.numpad-total.invalid{color:#dc2626;background:#fee2e2;}
.numpad.edit-mode .numpad-eq,
.numpad.edit-mode .numpad-total{display:none;}
.numpad.edit-mode .numpad-display{justify-content:center;}
.numpad.edit-mode .numpad-value{font-size:32px;}
.numpad-hint{display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:11px;color:var(--ink-soft);margin-bottom:6px;
  font-family:var(--sans);font-weight:600;flex-wrap:wrap;padding:0 4px;}
.numpad-hint .hint-sep{opacity:0.4;}
.numpad-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px;}
.np-chip{height:30px;background:linear-gradient(180deg,#fff,var(--paper-3));
  border:1px solid var(--border-soft);border-radius:6px;
  font-family:var(--serif);font-size:12px;font-weight:800;
  color:var(--ink-soft);cursor:pointer;transition:all .1s;}
.np-chip:active{background:var(--red-wash-2);transform:scale(.94);}
.np-chip.np-crit{background:linear-gradient(180deg,#fef3c7,#fde68a);
  color:#a16207;border-color:#fbbf24;}
.numpad-digits{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.np-btn{height:40px;padding:0;background:linear-gradient(180deg,#fff,var(--paper-2));
  border:1px solid var(--border-soft);border-radius:7px;
  font-family:var(--serif);font-size:18px;font-weight:800;
  color:var(--ink);cursor:pointer;transition:all .08s;
  box-shadow:0 1px 2px rgba(107,31,17,0.04);
  display:flex;align-items:center;justify-content:center;}
.np-btn:active{background:var(--red-wash-2);transform:scale(.94);}
.np-btn.np-del{background:linear-gradient(180deg,#fef2f2,#fee2e2);
  color:#b91c1c;font-size:16px;}
.np-btn.np-ok{background:linear-gradient(180deg,var(--red-light),var(--red));
  color:var(--paper);border-color:var(--red-deep);font-size:16px;}
.np-btn.np-ok:active{transform:scale(.94);}
.np-btn.np-ok:disabled{opacity:0.4;}

.situation-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  margin-bottom:12px;background:var(--paper);border:1px solid var(--border-soft);
  border-radius:12px;padding:6px;box-shadow:var(--shadow);}
.situation-btn{display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;background:transparent;border:none;border-radius:9px;
  cursor:pointer;font-family:var(--sans);transition:all .2s;color:var(--ink-soft);}
.situation-btn .sit-icon{font-size:20px;line-height:1;}
.situation-btn .sit-label{font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:0.8px;line-height:1;}
.situation-btn.active{background:var(--mode-accent);color:var(--paper);
  box-shadow:0 3px 12px rgba(0,0,0,0.2);}
.situation-btn.active.combat{background:linear-gradient(135deg,#8a1a08,#6b1f11);}
.situation-btn.active.exploration{background:linear-gradient(135deg,#4a6b3a,#3a5a2a);}
.situation-btn.active.rest{background:linear-gradient(135deg,#5b4a9c,#453880);}
body.mode-combat{--mode-accent:#6b1f11;--mode-wash:rgba(138,26,8,0.04);}
body.mode-exploration{--mode-accent:#4a6b3a;--mode-wash:rgba(74,107,58,0.05);}
body.mode-rest{--mode-accent:#5b4a9c;--mode-wash:rgba(91,74,156,0.05);}

.rest-panel{background:var(--paper);border:1px solid var(--border-soft);
  border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
  border-top:2px solid var(--moon);}
.rest-panel-title{font-family:var(--serif);font-size:14px;font-weight:700;
  font-variant:small-caps;letter-spacing:2px;color:var(--moon);
  padding:11px 14px;background:linear-gradient(180deg,var(--moon-wash),transparent);}
.rest-panel-body{padding:12px 14px;border-top:1px solid var(--border-soft);}
.rest-resources{background:var(--paper-2);border:1px solid var(--border-soft);
  border-radius:7px;padding:9px 11px;margin-bottom:10px;}
.rest-res-title{font-family:var(--serif);font-size:10px;font-weight:800;
  font-variant:small-caps;letter-spacing:1.5px;color:var(--moon);margin-bottom:5px;}
.rest-res-row{display:flex;justify-content:space-between;font-size:12px;
  padding:2px 0;align-items:center;}
.rest-res-row .k{color:var(--ink-soft);}
.rest-res-row .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--serif);}
.rest-res-row .v.low{color:var(--red);}
.rest-res-row .recharge-tag{font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.5px;padding:1px 6px;
  border-radius:6px;margin-left:6px;}
.recharge-short{background:rgba(34,197,94,0.15);color:#15803d;}
.recharge-long{background:rgba(91,74,156,0.15);color:var(--moon);}
.rest-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.rest-btn{padding:14px 10px;border:none;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-weight:800;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:all .15s;letter-spacing:0.5px;color:white;}
.rest-btn:active{transform:scale(.97);}
.rest-btn .rest-emoji{font-size:22px;line-height:1;}
.rest-btn .rest-desc{font-size:9px;font-weight:600;opacity:0.85;
  text-transform:uppercase;letter-spacing:0.5px;}
.rest-btn.short{background:linear-gradient(135deg,#15803d,#166534);}
.rest-btn.long{background:linear-gradient(135deg,#5b4a9c,#453880);}
.rest-hd-box{background:var(--paper-2);border:1px solid var(--moon);
  border-radius:8px;padding:10px 12px;margin-top:4px;}
.rest-hd-header{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;}
.rest-hd-title{font-family:var(--serif);font-size:12px;font-weight:800;
  color:var(--moon);letter-spacing:0.5px;}
.hd-badge{background:var(--moon);color:white;padding:2px 8px;
  border-radius:8px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.rest-hd-body{display:flex;align-items:center;gap:8px;}
.rest-hd-info{flex:1;display:flex;align-items:center;justify-content:center;
  background:#fff;border:1.5px solid var(--moon);border-radius:7px;
  padding:9px 12px;font-family:var(--serif);font-size:17px;font-weight:800;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0.3px;}
.btn-hd-roll{padding:9px 18px;
  background:linear-gradient(135deg,var(--moon),#7c5fc9);
  color:white;border:none;border-radius:7px;
  font-family:var(--sans);font-size:13px;font-weight:800;
  letter-spacing:0.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
.btn-hd-roll:active{transform:scale(.95);}
.btn-hd-roll:disabled{opacity:0.4;cursor:not-allowed;}
.rest-hd-helper{font-size:11px;color:var(--ink-soft);text-align:center;
  margin-top:6px;font-style:italic;}

.feature-uses{display:inline-flex;align-items:center;gap:4px;
  font-family:var(--sans);font-size:10px;font-weight:700;
  color:var(--ink-soft);margin-left:4px;margin-top:4px;}
.feature-uses .num{background:var(--paper-2);border:1px solid var(--border-soft);
  padding:1px 6px;border-radius:8px;font-variant-numeric:tabular-nums;}
.feature-uses .num.low{background:rgba(107,31,17,0.1);color:var(--red);border-color:var(--border);}
.btn-use{background:var(--paper-2);border:1px solid var(--border-soft);
  color:var(--ink-soft);width:20px;height:20px;border-radius:5px;
  cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0;}
.btn-use:active{background:var(--red-wash);color:var(--red);}
.btn-use:disabled{opacity:0.4;cursor:not-allowed;}
.btn-roll-feat{margin-top:8px;padding:9px 12px;
  background:linear-gradient(135deg,var(--moon),#7c5fc9);
  color:white;border:none;border-radius:6px;
  font-family:var(--sans);font-size:12px;font-weight:800;
  letter-spacing:0.5px;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-roll-feat:active{transform:scale(.97);}

.combat-feat-section{background:linear-gradient(135deg,rgba(91,74,156,0.06),rgba(91,74,156,0.02));
  border:1px solid rgba(91,74,156,0.2);border-left:3px solid var(--moon);
  border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.combat-feat-title{font-family:var(--serif);font-size:10px;font-weight:700;
  font-variant:small-caps;letter-spacing:1.5px;color:var(--moon);
  margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.combat-feat-title .hint{font-size:9px;color:var(--ink-soft);font-style:italic;
  font-weight:500;text-transform:none;letter-spacing:0;}
.toggle-btn.feat{border-color:rgba(91,74,156,0.3);}
.toggle-btn.active.feat{background:linear-gradient(135deg,var(--moon),#7c5fc9);
  border-color:var(--moon);color:var(--paper);}
.toggle-btn .once-badge{background:rgba(255,255,255,0.3);padding:0 5px;
  border-radius:6px;font-size:8px;font-weight:800;letter-spacing:0.3px;}
.toggle-btn.active .once-badge{background:rgba(0,0,0,0.2);}
.feat-combat-info{font-size:11px;color:var(--moon);margin-top:5px;

.feat-combat-info.active{background:rgba(91,74,156,0.15);
  box-shadow:0 1px 4px rgba(91,74,156,0.2);}

.sheet-header{text-align:center;padding:16px 12px 18px;position:relative;
  border-bottom:1px solid var(--border-soft);margin-bottom:12px;}
.char-name{font-family:var(--serif);font-size:34px;font-weight:700;
  font-variant:small-caps;letter-spacing:2px;color:var(--red);
  line-height:1.05;text-shadow:1px 1px 0 rgba(255,255,255,0.6);
  word-break:break-word;margin-bottom:4px;}
.char-line{font-family:var(--serif);font-size:14px;font-weight:700;
  color:var(--red-light);font-variant:small-caps;letter-spacing:1.8px;margin-top:3px;}
.char-line-sub{font-family:var(--serif);font-size:12px;color:var(--ink-soft);
  font-style:italic;margin-top:2px;}
.edit-float{position:absolute;top:12px;right:0;background:var(--paper);
  border:1px solid var(--border);color:var(--red);padding:6px 11px;
  border-radius:6px;font-family:var(--sans);font-size:11px;font-weight:700;
  letter-spacing:0.5px;cursor:pointer;box-shadow:var(--shadow-sm);}

.reminders{background:linear-gradient(135deg,rgba(201,162,39,0.1),rgba(166,124,0,0.06));
  border:1px solid var(--gold);border-left:3px solid var(--gold-light);
  border-radius:8px;padding:10px 12px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(166,124,0,0.12);}
.reminders-title{font-family:var(--serif);font-size:11px;font-weight:800;
  font-variant:small-caps;letter-spacing:1.5px;color:var(--gold);
  margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.reminders-title .count{font-size:10px;background:var(--gold);color:var(--paper);
  padding:1px 7px;border-radius:8px;font-family:var(--sans);letter-spacing:0;}
.reminder-item{display:flex;align-items:center;gap:7px;padding:5px 0;
  border-bottom:1px dotted rgba(166,124,0,0.25);font-size:13px;}
.reminder-item:last-child{border-bottom:none;}
.reminder-item.dim{opacity:0.45;}
.reminder-name{font-family:var(--serif);font-weight:700;color:var(--ink);flex:1;min-width:0;}
.reminder-qty{font-size:10px;font-weight:800;color:var(--gold);
  background:rgba(166,124,0,0.15);padding:1px 7px;border-radius:8px;font-variant-numeric:tabular-nums;}
.reminder-note{font-size:10px;color:var(--ink-soft);font-style:italic;display:block;margin-top:1px;}
.reminder-wild{font-size:9px;color:var(--red);font-style:italic;
  display:block;margin-top:1px;font-weight:600;}
.reminder-btn{background:rgba(166,124,0,0.12);border:1px solid rgba(166,124,0,0.3);
  color:var(--gold);font-size:14px;font-weight:700;width:24px;height:24px;
  border-radius:5px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;line-height:1;padding:0;}
.reminder-btn:active{background:rgba(166,124,0,0.25);}
.reminder-btn.off{background:rgba(107,31,17,0.08);border-color:rgba(107,31,17,0.2);
  color:var(--ink-dim);}
.reminder-btn:disabled{opacity:0.4;cursor:not-allowed;}

.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--paper);border:1px solid var(--border-soft);
  border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;}
.stat-box{text-align:center;padding:10px 4px;position:relative;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));transition:background .3s;}
.stat-box.rollable{cursor:pointer;}
.stat-box.rollable:active{background:var(--paper-3);}
.stat-box+.stat-box::before{content:'';position:absolute;left:0;top:20%;
  bottom:20%;width:1px;background:var(--border-soft);}
.stat-box .lbl{font-size:9px;font-weight:700;color:var(--red-light);
  font-variant:small-caps;letter-spacing:1px;line-height:1;margin-bottom:3px;}
.stat-box .val{font-family:var(--serif);font-size:19px;font-weight:700;
  color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums;}
.stat-box .val.hp{color:var(--red);}
.stat-box .val.editable{cursor:pointer;}
.stat-box .val.editable::after{content:'✎';font-size:9px;color:var(--ink-dim);
  margin-left:2px;vertical-align:super;}
.stat-box .sub{font-size:8px;color:var(--green);font-weight:700;letter-spacing:0.5px;
  margin-top:1px;text-transform:uppercase;}
.hp-controls{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.hp-btn{background:var(--paper);border:1px solid var(--border-soft);
  color:var(--red);font-size:13px;font-weight:700;width:20px;height:18px;
  border-radius:4px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;line-height:1;padding:0;}
.hp-btn:active{background:var(--red-wash-2);}
.hp-sub{font-size:10px;font-weight:700;color:var(--ink-soft);
  margin-top:1px;font-variant-numeric:tabular-nums;}

.ability-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px;}
.ability{text-align:center;padding:8px 3px;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border:1px solid var(--border-soft);border-radius:8px;box-shadow:var(--shadow-sm);
  cursor:pointer;transition:all .1s;position:relative;}
.ability:active{transform:scale(.95);background:var(--paper-3);}
.ability::after{content:'?';position:absolute;top:2px;right:4px;
  font-size:8px;color:var(--ink-dim);opacity:0.5;font-weight:700;}
.ability-name{font-size:9px;font-weight:800;color:var(--red-light);
  letter-spacing:0.8px;line-height:1;margin-bottom:2px;}
.ability-score{font-family:var(--serif);font-size:20px;font-weight:700;
  color:var(--ink);line-height:1.05;margin:1px 0;}
.ability-mod{font-family:var(--serif);font-size:11px;font-weight:700;
  color:var(--red);background:var(--red-wash);border-radius:8px;
  padding:1px 6px;display:inline-block;line-height:1.25;font-variant-numeric:tabular-nums;}

.slots-strip{background:var(--paper);border:1px solid var(--border-soft);
  border-radius:8px;padding:8px 12px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;}
.slots-title{font-family:var(--serif);font-size:11px;font-weight:700;
  font-variant:small-caps;letter-spacing:1.5px;color:var(--moon);}
.slots-groups{display:flex;gap:14px;flex-wrap:wrap;}
.slot-group{display:flex;align-items:center;gap:5px;}
.slot-lvl{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:0.5px;}
.slot-dots{display:flex;gap:3px;}
.slot-dot{width:14px;height:14px;border-radius:50%;
  border:1.5px solid var(--moon);background:transparent;padding:0;
  cursor:pointer;transition:all .15s;}
.slot-dot.filled{background:var(--moon);box-shadow:0 0 6px rgba(91,74,156,0.4);}
.slot-dot:active{transform:scale(.85);}
.slot-count{font-size:10px;font-weight:700;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;margin-left:2px;}

.panel{background:var(--paper);border:1px solid var(--border-soft);
  border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.panel.major{border-top:2px solid var(--mode-accent);}
.panel-title{font-family:var(--serif);font-size:14px;font-weight:700;
  font-variant:small-caps;letter-spacing:2px;color:var(--mode-accent);
  padding:11px 14px;cursor:pointer;user-select:none;display:flex;
  align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,var(--mode-wash),transparent);}
.panel-title::after{content:'▾';font-size:11px;color:var(--ink-dim);transition:transform .2s;}
.panel.collapsed .panel-title::after{transform:rotate(-90deg);}
.panel.collapsed .panel-body{display:none;}
.panel-body{padding:0 14px 14px;border-top:1px solid var(--border-soft);}
.panel-body>*:first-child{margin-top:10px;}

.saves-skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:420px){.saves-skills-grid{grid-template-columns:1fr;}}
.sub-title{font-family:var(--serif);font-size:11px;font-weight:700;
  font-variant:small-caps;letter-spacing:1.5px;color:var(--mode-accent);
  border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:4px;}

.stat-row{display:flex;align-items:center;gap:5px;padding:4px 2px;
  border-bottom:1px dotted var(--border-soft);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;
  flex:1;min-width:0;padding:2px 0;}
.stat-toggle input[type=checkbox]{width:13px;height:13px;margin:0;
  accent-color:var(--red);flex-shrink:0;}
.stat-bonus{font-family:var(--serif);font-weight:700;font-size:11px;
  min-width:32px;text-align:center;background:var(--red-wash);
  border-radius:8px;padding:1px 4px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.stat-row.prof .stat-bonus{background:var(--red);color:var(--paper);}
.stat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-attr{font-size:9px;color:var(--red-light);opacity:0.75;
  font-weight:700;letter-spacing:0.5px;flex-shrink:0;}

.toggles{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px;
  border-bottom:1px solid var(--border-soft);margin-bottom:10px;}
.toggle-btn{padding:7px 12px;background:var(--paper);
  border:1px solid var(--border-soft);border-radius:16px;
  font-size:11px;font-weight:700;letter-spacing:0.3px;
  color:var(--ink-soft);cursor:pointer;transition:all .15s;
  box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:4px;}
.toggle-btn.active{background:var(--red);color:var(--paper);border-color:var(--red);}
.toggle-btn.active.rage{background:#8a1a08;border-color:#8a1a08;}
.toggle-btn.active.wild{background:var(--green);border-color:var(--green);}
.toggle-btn .uses-badge{background:rgba(255,255,255,0.3);padding:0 5px;
  border-radius:8px;font-size:9px;font-weight:800;}
.toggle-btn.active .uses-badge{background:rgba(0,0,0,0.2);}
.toggle-btn .totem-hint{font-size:9px;opacity:0.75;margin-left:2px;font-style:italic;font-weight:600;}

.scenario{background:linear-gradient(135deg,var(--mode-wash),rgba(166,124,0,0.03));
  border:1px solid var(--border);border-left:3px solid var(--mode-accent);
  border-radius:6px;padding:11px 13px;margin-bottom:10px;}
.scenario-title{font-family:var(--serif);font-size:10px;font-weight:700;
  font-variant:small-caps;letter-spacing:2px;color:var(--mode-accent);margin-bottom:6px;}
.scenario-row{display:flex;justify-content:space-between;padding:3px 0;
  font-size:13px;align-items:baseline;gap:8px;}
.scenario-row .k{color:var(--ink-soft);font-weight:600;font-size:12px;flex-shrink:0;}
.scenario-row .v{color:var(--ink);font-weight:700;text-align:right;
  font-family:var(--serif);font-variant-numeric:tabular-nums;}
.scenario-row .v.hot{color:var(--red);}
.scenario-row .v.wild{color:var(--green);}
.scenario-row .v.feat{color:var(--moon);font-size:11px;}
.scenario-row .v.resist{color:var(--gold);font-size:11px;}
.scenario-effects{font-size:11px;color:var(--red-light);font-style:italic;
  margin-top:6px;padding-top:6px;border-top:1px dotted var(--border-soft);}

.wild-heal-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--moon),#7c5fc9);
  border:none;border-radius:8px;color:white;
  font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer;
  margin-bottom:10px;box-shadow:0 3px 14px rgba(91,74,156,0.35);
  display:flex;align-items:center;justify-content:center;gap:8px;}
.wild-heal-btn:active{transform:scale(.98);}
.wild-heal-btn:disabled{opacity:0.5;cursor:not-allowed;}
.wild-heal-btn .slots-mini{background:rgba(255,255,255,0.25);padding:2px 8px;
  border-radius:10px;font-size:11px;font-weight:700;}

.atk-card,.beast-card,.feature-card,.spell-card{
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border:1px solid var(--border-soft);border-radius:6px;
  padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow-sm);transition:all .15s;}
.atk-card{border-left:3px solid var(--border-mid);}
.atk-card.active{border-left-color:var(--red);
  background:linear-gradient(180deg,rgba(107,31,17,0.05),rgba(107,31,17,0.02));}
.beast-card{border-left:3px solid var(--green);}
.beast-card.active{background:linear-gradient(180deg,rgba(74,107,58,0.08),rgba(74,107,58,0.03));}
.feature-card{border-left:3px solid var(--gold);}
.feature-card.feat-card{border-left-color:var(--moon);}
.spell-card{border-left:3px solid var(--red-light);padding:11px 13px;margin-bottom:9px;}
.spell-card.feat-spell{border-left-color:var(--moon);}

.atk-header,.beast-header,.spell-header{display:flex;justify-content:space-between;
  align-items:flex-start;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.atk-name,.beast-name{font-family:var(--serif);font-weight:700;font-size:14px;
  flex:1;color:var(--ink);min-width:0;cursor:pointer;}
.spell-name{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);flex:1;min-width:0;}
.atk-actions{display:flex;gap:0;flex-shrink:0;}
.atk-tag,.spell-level{font-size:9px;font-weight:800;padding:2px 7px;
  border-radius:8px;background:var(--red);color:var(--paper);
  letter-spacing:0.5px;display:inline-block;margin-left:4px;
  text-transform:uppercase;white-space:nowrap;}
.spell-level{background:var(--red-light);margin-left:0;}
.spell-level.feat{background:var(--moon);}
.btn-icon{background:transparent;border:none;color:var(--ink-dim);
  font-size:14px;cursor:pointer;padding:3px 6px;border-radius:4px;line-height:1;}
.btn-icon:active{background:var(--red-wash-2);color:var(--red);}
.atk-line{display:flex;gap:6px;font-size:12px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.atk-line .ico{font-size:11px;min-width:14px;opacity:0.7;flex-shrink:0;}
.atk-line .lbl{color:var(--ink-soft);font-weight:600;font-size:11px;flex-shrink:0;}
.atk-line .val{color:var(--red);font-weight:700;font-family:var(--serif);
  font-variant-numeric:tabular-nums;font-size:12px;}
.atk-props{font-size:10px;color:var(--ink-dim);font-style:italic;margin-top:4px;}

.beast-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px;line-height:1.5;}
.beast-meta strong{color:var(--red);font-weight:700;}
.beast-abilities{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;
  margin:8px 0;padding:6px 4px;background:rgba(74,107,58,0.05);
  border-radius:5px;border:1px solid rgba(74,107,58,0.15);}
.beast-ab{text-align:center;font-size:10px;}
.beast-ab .n{color:var(--green);font-weight:800;letter-spacing:0.5px;font-size:9px;line-height:1;}
.beast-ab .s{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);line-height:1.1;}
.beast-ab .m{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.beast-info{font-size:11px;color:var(--ink-soft);margin:4px 0;line-height:1.5;
  padding:5px 0;border-top:1px dotted var(--border-soft);}
.beast-info strong{color:var(--red);font-weight:700;}
.beast-traits{margin:6px 0;}
.trait-item{font-size:11px;line-height:1.5;padding:3px 0;
  border-bottom:1px dotted var(--border-soft);}
.trait-item:last-child{border-bottom:none;}
.trait-item strong{color:var(--red);font-family:var(--serif);}
.beast-attacks{margin-top:6px;padding-top:6px;border-top:1px solid var(--border-soft);}
.beast-attack-block{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dotted var(--border-soft);}
.beast-attack-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.beast-atk-title{font-size:12px;color:var(--red);font-weight:700;margin-bottom:3px;}

.feature-header{display:flex;justify-content:space-between;
  align-items:flex-start;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
.feature-name{font-family:var(--serif);font-weight:700;font-size:13px;
  color:var(--red);flex:1;min-width:0;}
.feature-source{font-size:10px;font-weight:600;color:var(--ink-dim);font-style:italic;}
.feature-desc{font-size:12px;color:var(--ink);line-height:1.55;font-family:var(--serif);}
.feature-totem-tag{display:inline-block;font-size:9px;font-weight:700;
  background:rgba(201,162,39,0.15);color:var(--gold);
  padding:1px 6px;border-radius:6px;letter-spacing:0.5px;
  text-transform:uppercase;margin-left:4px;}
.feat-tag{display:inline-block;font-size:9px;font-weight:700;
  background:rgba(91,74,156,0.15);color:var(--moon);
  padding:1px 6px;border-radius:6px;letter-spacing:0.5px;
  text-transform:uppercase;margin-left:4px;}

.spell-meta{font-size:11px;color:var(--ink-soft);line-height:1.55;
  border-top:1px dotted var(--border-soft);border-bottom:1px dotted var(--border-soft);
  padding:5px 0;margin:5px 0;}
.spell-meta span{display:inline-block;margin-right:10px;}
.spell-meta strong{color:var(--red);}
.spell-combat{font-size:12px;color:var(--red);font-weight:700;
  margin:6px 0;padding:6px 9px;background:var(--red-wash);
  border-radius:5px;font-family:var(--serif);}
.spell-desc{font-size:12px;color:var(--ink);line-height:1.55;
  font-style:italic;margin-top:5px;font-family:var(--serif);}

.inv-card{background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border:1px solid var(--border-soft);border-radius:6px;
  padding:9px 12px;margin-bottom:6px;display:flex;
  justify-content:space-between;align-items:flex-start;gap:8px;box-shadow:var(--shadow-sm);}
.inv-card.reminder-on{border-left:3px solid var(--gold-light);}
.inv-card.unavailable-wild{opacity:0.45;}
.inv-name{font-family:var(--serif);font-weight:700;font-size:13px;}
.inv-qty{font-size:10px;font-weight:800;color:var(--red);
  background:var(--red-wash-2);padding:2px 8px;border-radius:8px;font-variant-numeric:tabular-nums;}
.inv-desc{font-size:11px;color:var(--ink-soft);margin-top:3px;font-style:italic;}
.inv-note{font-size:10px;color:var(--gold);margin-top:3px;font-style:italic;font-weight:600;}
.inv-wild-badge{display:inline-block;font-size:9px;font-weight:700;
  background:rgba(74,107,58,0.15);color:var(--green);
  padding:1px 6px;border-radius:6px;letter-spacing:0.5px;
  text-transform:uppercase;margin-left:6px;}
.inv-wild-badge.no{background:rgba(107,31,17,0.1);color:var(--ink-dim);}
.inv-total{padding:9px 11px;background:var(--paper-2);
  border:1px solid var(--border-soft);border-radius:6px;
  font-size:12px;color:var(--ink-soft);font-weight:600;
  text-align:center;margin-top:8px;font-variant:small-caps;letter-spacing:0.5px;}
.inv-total strong{color:var(--red);font-weight:800;}
.inv-over strong{color:#b91c1c;}
.btn-reminder{background:rgba(166,124,0,0.08);border:1px solid rgba(166,124,0,0.2);
  color:var(--gold);font-size:13px;cursor:pointer;width:26px;height:26px;
  border-radius:5px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
.btn-reminder.on{background:var(--gold);color:var(--paper);}
.btn-wild-toggle{background:rgba(74,107,58,0.08);border:1px solid rgba(74,107,58,0.25);
  color:var(--green);font-size:12px;cursor:pointer;width:26px;height:26px;
  border-radius:5px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
.btn-wild-toggle.on{background:var(--green);color:var(--paper);}

.btn-add{background:var(--paper);border:1px dashed var(--border-mid);
  color:var(--ink-soft);padding:9px;border-radius:6px;
  font-size:11px;font-weight:700;letter-spacing:0.5px;cursor:pointer;
  width:100%;font-family:var(--sans);margin-top:6px;text-transform:uppercase;}

  if(!state.inventory)state.inventory=JSON.parse(JSON.stringify(defaultState.inventory));

}catch(e){state=JSON.parse(JSON.stringify(defaultState));}

const getProf=()=>2+Math.floor((getTotalLevel()-1)/4);
const getMod=(score)=>Math.floor((score-10)/2);
const getAttrMod=(k)=>getMod(state.attrs[k]);
const getUnarmoredAC=()=>10+getAttrMod('dex')+getAttrMod('con');
const getBeastUnarmoredAC=(b)=>10+getMod(b?.attrs?.dex??10)+getMod(b?.attrs?.con??10);
const getSpellDC=()=>8+getProf()+getAttrMod(state.spellcasting.ability);
const getSpellAtk=()=>getProf()+getAttrMod(state.spellcasting.ability);
const getPassivePerc=()=>10+getSkillTotal('percepcao');
const isRage=()=>state.effects.find(e=>e.id==='rage')?.active;
const isWild=()=>state.effects.find(e=>e.id==='wild')?.active;
const getActiveWeapon=()=>state.weapons.find(w=>w.active);

const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseDice=(str)=>{
  if(!str||!String(str).trim())return null;
  const m=String(str).toLowerCase().trim().match(/^(\d+)d(\d+)$/);
  return m?{count:parseInt(m[1]),sides:parseInt(m[2])}:null;

function hasDruidLevels(){return state.character.classes.some(c=>(c.name||'').toLowerCase().includes('druida')&&parseInt(c.level)>0);}

function getCombatFeatAtkBonus(){return getActiveCombatFeats().reduce((s,f)=>s+(parseInt(f.combat.attackBonus)||0),0);}
function getCombatFeatDmgBonus(){return getActiveCombatFeats().reduce((s,f)=>s+(parseInt(f.combat.damageBonus)||0),0);}
function getCombatFeatDice(){

function categoryFromTarget(target){
  if(!target) return 'attacks';
  if(target.startsWith('skill-')||target.startsWith('save-')) return 'skills';
  if(target.startsWith('spdmg-')||target.startsWith('spcrit-')){

function renderHistEntries(cat){
  const entries=(state.history&&state.history[cat])||[];

  return entries.map(e=>{
    if(cat==='hp'){

      const sign=e.amount>0?'+':'';
      let body=`${e.before} → ${e.after} <b>(${sign}${e.amount})</b>`;
      if(e.overflowBefore!==undefined){
        body+=`<br><span style="opacity:0.7;font-size:11px">↳ overflow 👤 ${e.overflowBefore} → ${e.overflowAfter}</span>`;
      }

        </div>

function diceInfo(str){
  if(!str||str==='d20')return{min:1,max:20,types:[{count:1,sides:20}]};
  let min=0,max=0;const types=[];
  String(str).toLowerCase().split('+').forEach(p=>{
    const m=p.trim().match(/^(\d+)d(\d+)$/);
    if(m){
      const c=parseInt(m[1]),s=parseInt(m[2]);
      min+=c;max+=c*s;types.push({count:c,sides:s});
    }
  });
  if(!types.length)return{min:1,max:20,types:[{count:1,sides:20}]};
  return{min,max,types};
}
function formatDieLabel(dieStr){
  if(dieStr==='d20')return'd20';
  const info=diceInfo(dieStr);
  return info.types.map(t=>`${t.count}d${t.sides}`).join('+');
}
function getChips(min,max){
  if(min===1&&max===20)return[5,10,15,20];
  if(min===max)return[min];
  return[min,Math.round(min+(max-min)*0.33),Math.round(min+(max-min)*0.67),max];
}

function npConfirm(){
  if(!numpadState.target&&!numpadState.onConfirm)return;
  const v=numpadState.value;
  if(!v){showToast('Digite um valor');return;}
  const n=parseInt(v);
  if(isNaN(n)||n<numpadState.min||n>numpadState.max){
    showToast(`Valor deve estar entre ${numpadState.min} e ${numpadState.max}`);
    return;
  }
  const target=numpadState.target;
  const mod=numpadState.mod;
  const total=n+mod;
  const isD20=numpadState.isD20;
  const isCrit=isD20&&n===20;
  const isFail=isD20&&n===1;
  const label=numpadState.label;
  const onConfirmCb=numpadState.onConfirm;
  const dieStr=numpadState.dieStr;
  const isEditMode=numpadState.mode==='number';
  const isCritDamage=numpadState.isCritDamage;
  
  if(target&&document.querySelector(`[data-calc-target="${target}"]`)){
    calcValues[target]=v;
    updateInlineResult(target);
    const btn=document.querySelector(`[data-calc-target="${target}"]`);
    if(btn){btn.classList.add('just-confirmed');setTimeout(()=>btn.classList.remove('just-confirmed'),500);}
    if(calcTimers[target])clearTimeout(calcTimers[target]);
    const capturedV=v;
    calcTimers[target]=setTimeout(()=>{
      if(calcValues[target]===capturedV){
        delete calcValues[target];
        updateInlineResult(target);
      }
      delete calcTimers[target];
    },8000);
  }
  if(!onConfirmCb&&target&&!isEditMode){
    const cat=categoryFromTarget(target);
    const finalLabel = isCritDamage ? '⭐ CRÍTICO — '+label : label;
    logHistory(cat,{label:finalLabel,die:formatDieLabel(dieStr),roll:n,mod,total,isD20,crit:isCrit,fail:isFail,isCritDamage});
  }
  if(onConfirmCb){onConfirmCb(n,total);}
  
  document.getElementById('numpadOverlay').classList.remove('show');
  numpadState.target=null;numpadState.onConfirm=null;
  if(navigator.vibrate)navigator.vibrate(isCritDamage?[30,30,30]:20);
  updateFab();
  if(isEditMode)showToast(`${label}: ${n}`);
  else if(isCritDamage)showCritToast(`${label} — CRÍTICO: ${total}`);
  else showToast(`${label}: ${n}${fmtMod(mod)} = ${total}`);
}

  const mod=parseInt(btn.dataset.calcMod)||0;

// ===== DAMAGE CALCULATORS (normal + crit) =====
function calcWeaponAttack(w, isCrit){
  const attrMod=getAttrMod(w.attr||'str');
  const featAtkBonus=getCombatFeatAtkBonus();
  const toHit=getProf()+attrMod+(parseInt(w.magic)||0)+featAtkBonus;
  const rageBonus=(isRage()&&(w.attr||'str')==='str')?2:0;
  const featDmgBonus=getCombatFeatDmgBonus();
  const flatBonus=attrMod+(parseInt(w.magic)||0)+(parseInt(w.flat)||0)+rageBonus+featDmgBonus;
  
  // Build parts (dice) and diceStr (for numpad)
  const parts = [];
  const diceParts = [];
  
  // Primary weapon die
  if(w.die){
    const wd = parseDice(w.die);
    if(wd){
      const c = isCrit ? wd.count*2 : wd.count;
      parts.push(`${c}d${wd.sides}`);
      diceParts.push(`${c}d${wd.sides}`);
    }
  }
  // Extra elemental die
  if(w.extraDice){
    const ed = parseDice(w.extraDice);
    if(ed){
      const c = isCrit ? ed.count*2 : ed.count;
      parts.push(`+ ${c}d${ed.sides}${w.extraType?' '+w.extraType:''}`);
      diceParts.push(`${c}d${ed.sides}`);
    }
  }
  // Feat dice
  const featDice = getCombatFeatDice();
  featDice.forEach(fd=>{
    const d = parseDice(fd.dice);
    if(d){
      const c = isCrit ? d.count*2 : d.count;
      parts.push(`+ ${c}d${d.sides}${fd.damageType?' '+fd.damageType:''}`);
      diceParts.push(`${c}d${d.sides}`);
    }
  });
  // Flat bonus
  if(flatBonus !== 0){
    parts.push((flatBonus>0?'+ ':'- ')+Math.abs(flatBonus));
  }
  
  const damage = parts.join(' ');
  const diceStr = diceParts.join('+') || '1d6';
  
  // Range (for reference)
  let minDmg = flatBonus, maxDmg = flatBonus;
  const sides = Object.keys(parseDiceToMap(diceStr)).map(Number);
  const dm = parseDiceToMap(diceStr);
  sides.forEach(s => { minDmg += dm[s]; maxDmg += dm[s]*s; });
  
  return {toHit, damage, diceStr, flatBonus, rageBonus, featDice, featAtkBonus, featDmgBonus, minDmg, maxDmg, isCrit:!!isCrit};
}
function parseDiceToMap(str){
  const map = {};
  if(!str) return map;
  String(str).toLowerCase().split('+').forEach(p=>{
    const m = p.trim().match(/^(\d+)d(\d+)$/);
    if(m){
      const c=parseInt(m[1]), s=parseInt(m[2]);
      map[s] = (map[s]||0) + c;
    }
  });
  return map;
}
function calcBeastAttack(beast, atk, isCrit){
  const rageBonus = isRage()?2:0;
  const dmgMod = (parseInt(atk.mod)||0) + rageBonus;
  const d = parseDice(atk.die) || {count:1, sides:6};
  const count = isCrit ? d.count*2 : d.count;
  const diceStr = `${count}d${d.sides}`;
  const damage = `${diceStr} ${fmtMod(dmgMod)} ${atk.type}`;
  return {toHit: atk.mod, damage, diceStr, dmgMod, rageBonus, isCrit:!!isCrit};
}
function calcSpellDamageStr(sp, isCrit){
  if(!sp.damage) return null;
  const d = parseDice(sp.damage);
  if(!d) return null;
  const count = isCrit ? d.count*2 : d.count;
  const diceStr = `${count}d${d.sides}`;
  const dmgMod = parseInt(sp.damageMod)||0;
  const parts = [diceStr];
  if(dmgMod !== 0) parts.push(fmtMod(dmgMod));
  const damage = parts.join(' ') + (sp.damageType?' '+sp.damageType:'');
  return {damage, diceStr, dmgMod, isCrit:!!isCrit};
}

function applyDamage(amount){
  if(amount<=0)return;
  let logEntry={type:'damage',amount:-amount,target:'human',before:state.hp.current,after:0};
  if(isWild()&&state.wildHp.current>0){
    logEntry.target='wild';logEntry.before=state.wildHp.current;
    const absorbed=Math.min(state.wildHp.current,amount);
    state.wildHp.current-=absorbed;
    const overflow=amount-absorbed;
    logEntry.after=state.wildHp.current;
    if(state.wildHp.current===0){
      const wn=state.beasts[state.activeBeast]?.name||'Fera';
      state.effects.find(e=>e.id==='wild').active=false;
      state.wildHp={current:0,max:0};
      if(overflow>0){
        logEntry.overflowBefore=state.hp.current;
        state.hp.current=Math.max(0,state.hp.current-overflow);
        logEntry.overflowAfter=state.hp.current;
        showToast(`🐻 ${wn} caiu! ${overflow} passou pra forma humana`);
      }else showToast(`🐻 ${wn} caiu! Forma humana intacta`);
    }else showToast(`🐻 −${amount} HP (wild: ${state.wildHp.current}/${state.wildHp.max})`);
  }else{
    state.hp.current=Math.max(0,state.hp.current-amount);
    logEntry.after=state.hp.current;
    showToast(`👤 −${amount} HP`);
  }
  logHistory('hp',logEntry);
  if(navigator.vibrate)navigator.vibrate(60);
  renderAll();save();
}
function applyHealing(amount){
  if(amount<=0)return;
  let logEntry={type:'heal',amount:amount,target:'human',before:state.hp.current,after:0};
  if(isWild()){
    logEntry.target='wild';logEntry.before=state.wildHp.current;
    state.wildHp.current=Math.min(state.wildHp.max,state.wildHp.current+amount);
    logEntry.after=state.wildHp.current;
    showToast(`🐻 +${state.wildHp.current-logEntry.before} HP`);
  }else{
    state.hp.current=Math.min(state.hp.max,state.hp.current+amount);
    logEntry.after=state.hp.current;
    showToast(`👤 +${state.hp.current-logEntry.before} HP`);
  }
  logHistory('hp',logEntry);
  renderAll();save();
}
function quickHP(delta){if(delta<0)applyDamage(-delta);else applyHealing(delta);}

function getACBreakdown(){
  const bonus=parseInt(state.caBonus)||0;
  if(isWild()){
    const b=state.beasts[state.activeBeast];
    if(!b)return{source:'Fera não definida',base:10,bonus,total:10+bonus,isWild:true};
    const beastCA=b.ca||10;const beastUA=getBeastUnarmoredAC(b);const mode=state.caWildMode||'auto';
    let base,source;
    if(mode==='beast'){base=beastCA;source='CA da Fera';}
    else if(mode==='unarmored'){base=beastUA;source='UA da Fera';}
    else{if(beastUA>beastCA){base=beastUA;source='UA da Fera';}else{base=beastCA;source='CA da Fera';}}
    return{source,base,bonus,total:base+bonus,beastCA,beastUA,isWild:true,wildMode:mode};
  }
  const unarmored=getUnarmoredAC();
  if(state.caOverride>0)return{source:'Manual',base:state.caOverride,bonus,total:state.caOverride+bonus,unarmored,isWild:false};
  return{source:'Defesa sem Armadura',base:unarmored,bonus,total:unarmored+bonus,unarmored,isWild:false};
}

  if(isWild()){
    const b=state.beasts[state.activeBeast];

      if(b.speedWalk)p.push(`${b.speedWalk}m`);
      if(b.speedClimb)p.push(`esc ${b.speedClimb}m`);
      if(b.speedSwim)p.push(`nat ${b.speedSwim}m`);
      if(b.speedFly)p.push(`voo ${b.speedFly}m`);

  return `${state.speed||9}m`;
}
function fmtSpeed(b){
  const p=[];
  if(b.speedWalk)p.push(`${b.speedWalk}m`);
  if(b.speedClimb)p.push(`esc ${b.speedClimb}m`);
  if(b.speedSwim)p.push(`nat ${b.speedSwim}m`);
  if(b.speedFly)p.push(`voo ${b.speedFly}m`);
  return p.join(', ')||'—';
}

// Spell slots
function computeCasterLevel(){
  const full=['mago','clérigo','clerigo','druida','bardo','feiticeiro'];
  const half=['paladino','patrulheiro'];
  let lvl=0;
  state.character.classes.forEach(c=>{
    const n=(c.name||'').toLowerCase();const l=parseInt(c.level)||0;
    if(full.some(x=>n.includes(x)))lvl+=l;
    else if(half.some(x=>n.includes(x)))lvl+=Math.floor(l/2);
  });
  return lvl;
}
function getMaxSlots(){
  const table=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],
    [4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],
    [4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],
    [4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
  const cl=computeCasterLevel();
  const arr=table[Math.min(20,Math.max(0,cl))]||[];
  const result={};arr.forEach((n,i)=>{result[i+1]=n;});
  return result;
}
function getCurrentSlots(){
  const max=getMaxSlots();const cur={...state.spellSlots};
  Object.keys(max).forEach(lvl=>{
    if(cur[lvl]===undefined)cur[lvl]=max[lvl];
    cur[lvl]=Math.min(cur[lvl],max[lvl]);cur[lvl]=Math.max(0,cur[lvl]);
  });
  Object.keys(cur).forEach(lvl=>{if(!(lvl in max))delete cur[lvl];});
  return cur;
}
function getLowestAvailableSlot(){
  const cur=getCurrentSlots();
  const lvls=Object.keys(cur).map(Number).sort((a,b)=>a-b);
  for(const l of lvls)if(cur[l]>0)return l;
  return null;
}
function expendSlot(lvl){
  const cur=getCurrentSlots();
  if(!cur[lvl]||cur[lvl]<=0)return false;
  cur[lvl]--;state.spellSlots=cur;return true;
}
function toggleSlot(lvl,idx){
  const cur=getCurrentSlots();const max=getMaxSlots()[lvl]||0;
  if(idx<cur[lvl])cur[lvl]--;else if(cur[lvl]<max)cur[lvl]++;
  state.spellSlots=cur;renderAll();save();
}

        <span class="ico">${isCure?'💚':'💥'}</span>

    // Critical damage row (only for attack spells that deal damage, not healing)

    const canCrit = sp.damage && sp.damageType!=='cura' && (sp.attackType==='spell'||sp.attackType==='melee');
    if(canCrit){
      const critCalc = calcSpellDamageStr(sp,true);
      critRow=`<div class="atk-line crit-line">

    return `<div class="spell-card${isFeat?' feat-spell':''}">

  let spellsHTML='';

function renderAll(){
  document.body.className='mode-'+(state.situation||'combat');
  const sit=state.situation||'combat';
  let content='';
  content+=renderHeader()+renderSituationBar();
  if(sit==='rest'){
    content+=renderRestPanel()+renderStatsBar()+renderReminders()+renderSpellSlots()+
      renderAbilities()+renderCombat()+renderSavesSkills()+renderFeatures()+renderFeats()+
      renderSpells()+renderForms()+renderInventory();
  }else if(sit==='exploration'){
    content+=renderStatsBar()+renderAbilities()+renderSavesSkills()+renderReminders()+
      renderSpellSlots()+renderCombat()+renderFeatures()+renderFeats()+renderSpells()+renderForms()+renderInventory();
  }else{
    content+=renderReminders()+renderStatsBar()+renderAbilities()+renderSpellSlots()+
      renderCombat()+renderSavesSkills()+renderFeatures()+renderFeats()+renderSpells()+renderForms()+renderInventory();
  }
  document.getElementById('app').innerHTML=content;
  Object.keys(calcValues).forEach(target=>updateInlineResult(target));

function togglePanelKey(key){panelState[key]=!panelState[key];renderAll();}
function toggleEffect(id){
  const e=state.effects.find(x=>x.id===id);if(!e)return;
  const feat=state.features.find(f=>f.name===e.name);
  if(!e.active){
    if(feat&&feat.uses){
      if(feat.uses.current<=0){showToast(`Sem usos de ${feat.name}. Use um descanso.`);return;}
      feat.uses.current--;
    }
    e.active=true;
    if(id==='rage'&&hasTotemBear())showToast('🔥 Fúria — 🐾 resistência a tudo exceto psíquico');
    if(id==='wild'){
      const b=state.beasts[state.activeBeast];
      if(b){state.wildHp={current:b.hp,max:b.hp};showToast(`🐻 Forma Selvagem: ${b.name} (${b.hp} HP)`);}
    }
  }else{
    e.active=false;
    if(id==='wild'){
      const remaining=state.wildHp.current;
      state.wildHp={current:0,max:0};
      showToast(remaining>0?`👤 Forma revertida (HP humano: ${state.hp.current}/${state.hp.max})`:'👤 Forma revertida');
    }
  }
  renderAll();save();
}
function toggleSave(k){state.saves[k]=!state.saves[k];renderAll();save();}
function toggleSkill(k){state.skills[k]=!state.skills[k];renderAll();save();}
function selectWeapon(id){
  if(isWild())return showToast('Desative Forma Selvagem primeiro');
  state.weapons.forEach(w=>w.active=w.id===id);
  renderAll();save();
}
function selectBeast(key){
  if(isWild()&&state.wildHp.current>0){
    if(!confirm(`Trocar para ${state.beasts[key].name}? Wild HP será resetado para ${state.beasts[key].hp}.`))return;
    state.wildHp={current:state.beasts[key].hp,max:state.beasts[key].hp};
  }
  state.activeBeast=key;renderAll();save();
}

let modalCtx=null;
function openModal(title,bodyHTML,onSave){
  modalCtx={onSave};
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    <button class="btn-save" onclick="saveModal()">Salvar</button>`;
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow='hidden';
  updateFab();
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow='';modalCtx=null;
  updateFab();
}
function saveModal(){
  if(!modalCtx||!modalCtx.onSave)return;
  const data={};
  document.querySelectorAll('#modalBody [name]').forEach(el=>{data[el.name]=el.value;});
  document.querySelectorAll('#modalBody [name][type=checkbox]').forEach(el=>{data[el.name]=el.checked;});
  document.querySelectorAll('#modalBody [name][type=radio]:checked').forEach(el=>{data[el.name]=el.value;});
  document.querySelectorAll('#modalBody .num-field[data-target]').forEach(el=>{
    data[el.dataset.target]=el.dataset.value;
  });
  modalCtx.onSave(data);
  closeModal();
}

      magic:parseInt(data.magic)||0,flat:parseInt(data.flat)||0,extraDice:data.extraDice||'',
      extraType:data.extraType||'',attr:data.attr||'str',props:data.props||'',
      active:id?w.active:state.weapons.length===0};
    if(id){const i=state.weapons.findIndex(x=>x.id===id);state.weapons[i]=newW;}
    else{if(newW.active)state.weapons.forEach(x=>x.active=false);state.weapons.push(newW);}
    renderAll();save();showToast('✓ Arma salva');
  });
}
function openSpellModal(id){
  const s=id?state.spells.find(x=>x.id===id):{name:'',level:0,school:'Evocação',castTime:'1 ação',range:'9 m',components:'V, S',duration:'Instantânea',attackType:'',saveAbility:'dex',damage:'',damageType:'',damageMod:0,description:''};
  const html=`
    <div class="field-row">
      <div class="field"><label>Nome</label><input name="name" value="${esc(s.name)}"></div>
      <div class="field"><label>Nível</label><input type="number" name="level" value="${s.level}" min="0" max="9"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Escola</label>
        <select name="school">${['Abjuração','Adivinhação','Conjuração','Encantamento','Evocação','Ilusão','Necromancia','Transmutação'].map(sc=>`<option value="${sc}" ${s.school===sc?'selected':''}>${sc}</option>`).join('')}</select></div>
      <div class="field"><label>Tempo</label><input name="castTime" value="${esc(s.castTime||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Alcance</label><input name="range" value="${esc(s.range||'')}"></div>

    </div>
    <div class="field"><label>Duração</label><input name="duration" value="${esc(s.duration||'')}"></div>
    <div class="modal-sub">Combate</div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select name="attackType">
          <option value="" ${!s.attackType?'selected':''}>Nenhum</option>
          <option value="spell" ${s.attackType==='spell'?'selected':''}>Ataque Mágico</option>
          <option value="melee" ${s.attackType==='melee'?'selected':''}>Corpo a Corpo</option>
          <option value="save" ${s.attackType==='save'?'selected':''}>Teste de Resistência</option>
        </select></div>
      <div class="field"><label>Atributo</label>
        <select name="saveAbility">${['str','dex','con','int','wis','cha'].map(k=>`<option value="${k}" ${s.saveAbility===k?'selected':''}>${ATTR_NAMES[k]}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Dano/Cura</label><input name="damage" value="${esc(s.damage||'')}"></div>
      <div class="field"><label>Tipo</label><input name="damageType" value="${esc(s.damageType||'')}"></div>
    </div>
    <div class="field"><label>Bônus Fixo (ex: SAB)</label><input type="number" name="damageMod" value="${s.damageMod||0}"></div>
    <div class="field"><label>Descrição</label><textarea name="description">${esc(s.description||'')}</textarea></div>`;
  openModal(id?'Editar Magia':'Nova Magia',html,data=>{
    const newS={id:id||'sp_'+Date.now(),name:data.name||'Magia',level:parseInt(data.level)||0,
      school:data.school||'',castTime:data.castTime||'',range:data.range||'',
      components:data.components||'',duration:data.duration||'',
      attackType:data.attackType||'',saveAbility:data.saveAbility||'dex',
      damage:data.damage||'',damageType:data.damageType||'',damageMod:parseInt(data.damageMod)||0,
      description:data.description||'',source:id?(state.spells.find(x=>x.id===id)?.source||undefined):undefined};
    if(id){const i=state.spells.findIndex(x=>x.id===id);state.spells[i]=newS;}
    else state.spells.push(newS);
    renderAll();save();showToast('✓ Magia salva');
  });
}
function openFeatureModal(id){
  const f=id?state.features.find(x=>x.id===id):{name:'',source:'',desc:'',uses:null,recharge:'none'};
  const hasUses=!!f.uses;
  const html=`
    <div class="field-row">
      <div class="field"><label>Nome</label><input name="name" value="${esc(f.name)}"></div>
      <div class="field"><label>Origem</label><input name="source" value="${esc(f.source||'')}"></div>
    </div>
    <div class="field"><label>Descrição</label><textarea name="desc" style="min-height:100px">${esc(f.desc||'')}</textarea></div>
    <div class="modal-sub">Usos Limitados</div>
    <label class="checkbox-row">
      <input type="checkbox" name="hasUses" ${hasUses?'checked':''} onchange="toggleFeatureUsesFields(this.checked)">
      <span>Tem usos limitados</span>
    </label>
    <div id="featUsesFields" style="display:${hasUses?'block':'none'}">
      <div class="field-row">
        <div class="field"><label>Máx</label><input type="number" name="usesMax" value="${f.uses?.max||1}" min="1"></div>
        <div class="field"><label>Atuais</label><input type="number" name="usesCur" value="${f.uses?.current||f.uses?.max||1}" min="0"></div>
      </div>
      <div class="field"><label>Recarrega em</label>
        <select name="recharge">
          <option value="none" ${f.recharge==='none'?'selected':''}>Nunca</option>
          <option value="short" ${f.recharge==='short'?'selected':''}>Curto</option>
          <option value="long" ${f.recharge==='long'?'selected':''}>Longo</option>
        </select></div>
    </div>`;
  openModal(id?'Editar Habilidade':'Nova Habilidade',html,data=>{
    const newF={id:id||'f_'+Date.now(),name:data.name||'Habilidade',source:data.source||'',desc:data.desc||''};
    if(data.hasUses){
      const max=Math.max(1,parseInt(data.usesMax)||1);
      const cur=Math.max(0,Math.min(max,parseInt(data.usesCur)||max));
      newF.uses={current:cur,max};newF.recharge=data.recharge||'none';
    }else{newF.uses=null;newF.recharge='none';}
    if(id){const i=state.features.findIndex(x=>x.id===id);state.features[i]=newF;}
    else state.features.push(newF);
    renderAll();save();showToast('✓ Habilidade salva');
  });
}
function toggleFeatureUsesFields(show){document.getElementById('featUsesFields').style.display=show?'block':'none';}

function openFeatModal(id){
  const f=id?state.feats.find(x=>x.id===id):{name:'',source:'Talento',desc:'',uses:null,recharge:'none',damage:'',damageType:''};
  const hasUses=!!f.uses;
  const hasCombat=!!(f.combat&&(f.combat.dice||f.combat.attackBonus||f.combat.damageBonus));
  const combat=f.combat||{};
  const html=`
    <div class="field-row">
      <div class="field"><label>Nome</label><input name="name" value="${esc(f.name)}"></div>
      <div class="field"><label>Origem</label><input name="source" value="${esc(f.source||'Talento')}"></div>
    </div>
    <div class="field"><label>Descrição</label><textarea name="desc" style="min-height:100px">${esc(f.desc||'')}</textarea></div>
    <div class="modal-sub">Usos Limitados</div>
    <label class="checkbox-row">
      <input type="checkbox" name="hasUses" ${hasUses?'checked':''} onchange="toggleFeatUsesFields(this.checked)">
      <span>Tem usos limitados</span>
    </label>
    <div id="featUsesFields2" style="display:${hasUses?'block':'none'}">
      <div class="field-row">
        <div class="field"><label>Máx</label><input type="number" name="usesMax" value="${f.uses?.max||1}" min="1"></div>
        <div class="field"><label>Atuais</label><input type="number" name="usesCur" value="${f.uses?.current||f.uses?.max||1}" min="0"></div>
      </div>
      <div class="field"><label>Recarrega em</label>
        <select name="recharge">
          <option value="none" ${f.recharge==='none'?'selected':''}>Nunca</option>
          <option value="short" ${f.recharge==='short'?'selected':''}>Curto</option>
          <option value="long" ${f.recharge==='long'?'selected':''}>Longo</option>
        </select></div>
    </div>
    <div class="modal-sub">Efeito em Combate</div>
    <label class="checkbox-row">
      <input type="checkbox" name="hasCombat" ${hasCombat?'checked':''} onchange="toggleFeatCombatFields(this.checked)">
      <span>Este talento modifica ataques/dano em combate</span>
    </label>
    <div id="featCombatFields" style="display:${hasCombat?'block':'none'}">
      <p class="helper" style="margin:0 0 8px">Ao ativar em combate, o talento aplica os bônus abaixo ao ataque/dano.</p>
      <div class="field-row">
        <div class="field"><label>Dado de Dano Extra</label><input name="combatDice" value="${esc(combat.dice||'')}" placeholder="ex: 1d8"></div>
        <div class="field"><label>Tipo de Dano</label><input name="combatDamageType" value="${esc(combat.damageType||'')}" placeholder="veneno"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Bônus de Acerto</label><input type="number" name="combatAttackBonus" value="${combat.attackBonus||0}"></div>
        <div class="field"><label>Bônus de Dano (fixo)</label><input type="number" name="combatDamageBonus" value="${combat.damageBonus||0}"></div>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" name="combatOncePerTurn" ${combat.oncePerTurn?'checked':''}>
        <span>Uma vez por turno (mostra aviso no toggle)</span>
      </label>
    </div>
    <div class="modal-sub">Dano Avulso (opcional)</div>
    <p class="helper" style="margin:0 0 6px">Use quando quiser rolar o dano separado do ataque (ex: efeito residual).</p>
    <div class="field-row">
      <div class="field"><label>Dado de Dano</label><input name="damage" value="${esc(f.damage||'')}" placeholder="ex: 1d8"></div>
      <div class="field"><label>Tipo</label><input name="damageType" value="${esc(f.damageType||'')}" placeholder="veneno"></div>
    </div>`;
  openModal(id?'Editar Talento':'Novo Talento',html,data=>{
    const newF={id:id||'feat-'+Date.now(),name:data.name||'Talento',source:data.source||'Talento',desc:data.desc||'',
      damage:data.damage||'',damageType:data.damageType||''};
    if(data.hasUses){
      const max=Math.max(1,parseInt(data.usesMax)||1);
      const cur=Math.max(0,Math.min(max,parseInt(data.usesCur)||max));
      newF.uses={current:cur,max};newF.recharge=data.recharge||'none';
    }else{newF.uses=null;newF.recharge='none';}
    if(data.hasCombat){
      const prevActive=id?(state.feats.find(x=>x.id===id)?.combat?.active||false):false;
      newF.combat={dice:data.combatDice||'',damageType:data.combatDamageType||'',
        attackBonus:parseInt(data.combatAttackBonus)||0,
        damageBonus:parseInt(data.combatDamageBonus)||0,
        oncePerTurn:!!data.combatOncePerTurn,active:prevActive};
    }else{newF.combat=null;}
    if(id){const i=state.feats.findIndex(x=>x.id===id);state.feats[i]=newF;}
    else state.feats.push(newF);
    renderAll();save();showToast('✓ Talento salvo');
  });
}
function toggleFeatUsesFields(show){document.getElementById('featUsesFields2').style.display=show?'block':'none';}
function toggleFeatCombatFields(show){document.getElementById('featCombatFields').style.display=show?'block':'none';}

function openBeastModal(key){
  const src=key?state.beasts[key]:emptyBeast();
  const b=JSON.parse(JSON.stringify(src));
  const atk=b.attacks[0];
  const html=`
    <div class="field"><label>Nome</label><input name="name" value="${esc(b.name)}"></div>
    <div class="field-row-3">
      <div class="field"><label>CR</label><input name="cr" value="${esc(b.cr||'1')}"></div>
      <div class="field"><label>CA</label><input type="number" name="ca" value="${b.ca||10}"></div>
      <div class="field"><label>HP</label><input type="number" name="hp" value="${b.hp||10}"></div>
    </div>
    <div class="modal-sub">Deslocamentos (m)</div>
    <div class="field-row-3">
      <div class="field"><label>Terrestre</label><input type="number" name="speedWalk" value="${b.speedWalk||0}" step="1.5"></div>
      <div class="field"><label>Escalar</label><input type="number" name="speedClimb" value="${b.speedClimb||0}" step="1.5"></div>
      <div class="field"><label>Nadar</label><input type="number" name="speedSwim" value="${b.speedSwim||0}" step="1.5"></div>
    </div>
    <div class="field"><label>Voar</label><input type="number" name="speedFly" value="${b.speedFly||0}" step="1.5"></div>
    <div class="modal-sub">Atributos</div>
    <div class="field-row-3">
      <div class="field"><label>FOR</label><input type="number" name="bStr" value="${b.attrs.str}"></div>
      <div class="field"><label>DES</label><input type="number" name="bDex" value="${b.attrs.dex}"></div>
      <div class="field"><label>CON</label><input type="number" name="bCon" value="${b.attrs.con}"></div>
    </div>
    <div class="field-row-3">
      <div class="field"><label>INT</label><input type="number" name="bInt" value="${b.attrs.int}"></div>
      <div class="field"><label>SAB</label><input type="number" name="bWis" value="${b.attrs.wis}"></div>
      <div class="field"><label>CAR</label><input type="number" name="bCha" value="${b.attrs.cha}"></div>
    </div>
    <div class="modal-sub">Sentidos e Perícias</div>
    <div class="field"><label>Sentidos</label><input name="senses" value="${esc(b.senses||'')}"></div>
    <div class="field"><label>Perícias (vírgula)</label><input name="skillsStr" value="${Object.keys(b.skills||{}).join(', ')}"></div>
    <div class="modal-sub">Multiataque e Traços</div>
    <div class="field"><label>Multiataque</label><input name="multiattack" value="${esc(b.multiattack||'')}"></div>
    <div class="field"><label>Traços (Nome: descrição)</label>
      <textarea name="traitsStr" style="min-height:80px">${esc((b.traits||[]).map(t=>`${t.name}: ${t.desc}`).join('\n'))}</textarea></div>
    <div class="modal-sub">Ataque Principal</div>
    <div class="field"><label>Nome</label><input name="atkName" value="${esc(atk.name||'Ataque')}"></div>
    <div class="field-row-3">
      <div class="field"><label>Dado</label><input name="atkDie" value="${esc(atk.die||'1d6')}"></div>
      <div class="field"><label>Mod. Acerto</label><input type="number" name="atkMod" value="${atk.mod||0}"></div>
      <div class="field"><label>Tipo</label><input name="atkType" value="${esc(atk.type||'cortante')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Alcance</label><input name="atkReach" value="${esc(atk.reach||'1,5m')}"></div>
      <div class="field"><label>Efeito Extra</label><input name="atkExtra" value="${esc(atk.extra||'')}"></div>
    </div>`;
  openModal(key?'Editar Fera':'Nova Fera',html,data=>{
    const skillsObj={};
    (data.skillsStr||'').split(',').map(s=>s.trim().toLowerCase()).filter(k=>SKILLS[k]).forEach(k=>{skillsObj[k]='prof';});
    const traitsArr=(data.traitsStr||'').split('\n').map(line=>{
      const idx=line.indexOf(':');
      if(idx<0)return{name:line.trim(),desc:''};
      return{name:line.slice(0,idx).trim(),desc:line.slice(idx+1).trim()};
    }).filter(t=>t.name);
    const newB={name:data.name||'Fera',cr:data.cr||'1',ca:parseInt(data.ca)||10,hp:parseInt(data.hp)||10,
      speedWalk:parseFloat(data.speedWalk)||0,speedClimb:parseFloat(data.speedClimb)||0,
      speedSwim:parseFloat(data.speedSwim)||0,speedFly:parseFloat(data.speedFly)||0,
      attrs:{str:parseInt(data.bStr)||10,dex:parseInt(data.bDex)||10,con:parseInt(data.bCon)||10,
        int:parseInt(data.bInt)||10,wis:parseInt(data.bWis)||10,cha:parseInt(data.bCha)||10},
      saves:b.saves||{},skills:skillsObj,senses:data.senses||'',traits:traitsArr,
      multiattack:data.multiattack||'',
      attacks:[{name:data.atkName||'Ataque',die:data.atkDie||'1d6',mod:parseInt(data.atkMod)||0,
        type:data.atkType||'cortante',reach:data.atkReach||'1,5m',extra:data.atkExtra||''}]};
    const newKey=key||'b_'+Date.now();
    state.beasts[newKey]=newB;
    if(!key)state.activeBeast=newKey;
    renderAll();save();showToast('✓ Fera salva');
  });
}
function openInvModal(id){
  const it=id?state.inventory.find(x=>x.id===id):{name:'',qty:1,weight:0,desc:'',reminder:false,reminderNote:'',availableInWild:false};
  const html=`
    <div class="field"><label>Nome</label><input name="name" value="${esc(it.name)}"></div>
    <div class="field-row">
      <div class="field"><label>Quantidade</label><input type="number" name="qty" value="${it.qty}" min="0"></div>
      <div class="field"><label>Peso (lbs)</label><input type="number" name="weight" value="${it.weight}" min="0" step="0.1"></div>
    </div>
    <div class="field"><label>Descrição</label><textarea name="desc">${esc(it.desc||'')}</textarea></div>
    <div class="modal-sub">Lembrete</div>
    <label class="checkbox-row">
      <input type="checkbox" name="reminder" ${it.reminder?'checked':''}>
      <span>Mostrar como lembrete fixo</span>
    </label>
    <div class="field"><label>Nota</label><input name="reminderNote" value="${esc(it.reminderNote||'')}"></div>
    <div class="modal-sub">Forma Selvagem</div>
    <label class="checkbox-row">
      <input type="checkbox" name="availableInWild" ${it.availableInWild?'checked':''}>
      <span>Disponível na Forma Selvagem</span>
    </label>`;
  openModal(id?'Editar Item':'Novo Item',html,data=>{
    const newI={id:id||'i_'+Date.now(),name:data.name||'Item',qty:parseInt(data.qty)||1,
      weight:parseFloat(data.weight)||0,desc:data.desc||'',reminder:!!data.reminder,
      reminderNote:data.reminderNote||'',availableInWild:!!data.availableInWild};
    if(id){const i=state.inventory.findIndex(x=>x.id===id);state.inventory[i]=newI;}
    else state.inventory.push(newI);
    renderAll();save();showToast('✓ Item salvo');
  });
}
function deleteWeapon(id){if(!confirm('Remover arma?'))return;state.weapons=state.weapons.filter(w=>w.id!==id);renderAll();save();}
function deleteSpell(id){if(!confirm('Remover magia?'))return;state.spells=state.spells.filter(s=>s.id!==id);renderAll();save();}
function deleteInv(id){if(!confirm('Remover item?'))return;state.inventory=state.inventory.filter(i=>i.id!==id);renderAll();save();}
function deleteBeast(key){if(!confirm('Remover fera?'))return;delete state.beasts[key];if(state.activeBeast===key)state.activeBeast=Object.keys(state.beasts)[0]||null;renderAll();save();}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');t.classList.remove('crit');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show','crit'),2400);
}

state.spellSlots=getCurrentSlots();
renderAll();
</script>
</body>
</html>
